<svg width="100" height="60" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Конфета -->
  <!-- Левая обертка -->
  <path d="M 10 20 L 30 10 L 30 50 L 10 40 Z" fill="#f093fb"/>
  <path d="M 10 20 L 30 10 L 30 15 L 10 25 Z" fill="#ff8fab"/>

  <!-- Тело конфеты -->
  <ellipse cx="50" cy="30" rx="20" ry="15" fill="url(#candyGrad)"/>

  <!-- Полоски -->
  <rect x="35" y="20" width="30" height="4" fill="#fff" opacity="0.5" transform="rotate(-5 50 30)"/>
  <rect x="35" y="30" width="30" height="4" fill="#fff" opacity="0.5" transform="rotate(-5 50 30)"/>
  <rect x="35" y="40" width="30" height="4" fill="#fff" opacity="0.5" transform="rotate(-5 50 30)"/>

  <!-- Правая обертка -->
  <path d="M 90 20 L 70 10 L 70 50 L 90 40 Z" fill="#f093fb"/>
  <path d="M 90 20 L 70 10 L 70 15 L 90 25 Z" fill="#ff8fab"/>

  <defs>
    <linearGradient id="candyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5576c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b9d;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
